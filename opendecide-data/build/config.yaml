# ------------------------------------------------------------------------------------------------------------------
# Models (4.6, 5.x, 13 step 0) — s01_lock resolves each to a full sha (model_info) and records weight-file sha256.
# ------------------------------------------------------------------------------------------------------------------
models:
  gliclass_edge:
    repo: knowledgator/gliclass-edge-v3.0
    revision: df03993a2ed98e5e4a0d2dd7efbbd105abe874cf
    license: Apache-2.0
    params: {architecture_type: uni-encoder, prompt_first: true, max_length: 1024}
    role: baseline + fine-tune start (Edge)
  gliclass_modern_base:
    repo: knowledgator/gliclass-modern-base-v3.0
    revision: ac369222ca4375ca66ebaf7fb5220f223514c035
    license: Apache-2.0
    params: {architecture_type: uni-encoder, prompt_first: true, max_length: 1024}
    role: baseline + fine-tune start (headline)
  deberta_large_c:
    repo: MoritzLaurer/deberta-v3-large-zeroshot-v2.0-c
    revision: b2730f16
    license: MIT
    role: NLI zero-shot baseline
  deberta_base_c:
    repo: MoritzLaurer/deberta-v3-base-zeroshot-v2.0-c
    revision: bddf8c54
    license: MIT
    role: NLI zero-shot baseline
  minilm:
    repo: sentence-transformers/all-MiniLM-L6-v2
    revision: 1110a243fdf4706b3f48f1d95db1a4f5529b4d41   # resolved and downloaded 2026-09-25 (foundation engineer)
    license: Apache-2.0
    role: the only model allowed to screen, select or filter (R1)
  qwen3_0_6b:
    repo: Qwen/Qwen3-0.6B
    revision: c1899de289a04d12100db370d81485cdf75e47ca
    license: Apache-2.0
    params: {enable_thinking: false, dtype: bf16, decoding: greedy}
    role: small-LLM baseline (pinned, not run in the build; D7)
  qwen3_1_7b:
    repo: Qwen/Qwen3-1.7B
    revision: 70d244cc86ccca08cf5af4e1e306ecf908b1ad5e
    license: Apache-2.0
    params: {enable_thinking: false, dtype: bf16, decoding: greedy}
    role: small-LLM baseline (pinned, not run in the build; D7)
  smollm2_1_7b:
    repo: HuggingFaceTB/SmolLM2-1.7B-Instruct
    revision: 31b70e2e869a7173562077fd711b654946d38674
    license: Apache-2.0
    params: {dtype: bf16, decoding: greedy}
    role: small-LLM baseline (pinned, not run in the build; D7)
  ettin_encoder_32m:
    repo: jhu-clsp/ettin-encoder-32m
    revision: null                         # tokenizer for token caps; lock records the head
    license: MIT
    role: tokenizer (V8)
  modernbert_base:
    repo: answerdotai/ModernBERT-base
    revision: null
    license: Apache-2.0
    role: tokenizer (V8)
no_claude_baselines: true                  # D2
serializers:
  version: ser-v1
  gliclass: {noul: "labels=[instructions + (' (Yes: {true}; No: {false})' if criteria)], prompt=None, sigmoid",
             choice: "labels=[f'{key}: {desc}' or key], prompt=instructions, softmax",
             score: "labels=[level descriptions in stored order], prompt=instructions, softmax",
             one_row_per_forward_pass: true}
  deberta: {none_variants: [max_ent, dev_tau, literal_diagnostic], never_render_none_as_hypothesis: true}
  llm_prompt_llm_p1:
    system: "You answer questions about a text. Use only the text."
    user: "Text:\n{state}\n\nQuestion: {instructions}{criteria_line}\n{answer_line}"
    criteria_line: " (Yes means: {true}; No means: {false})"
    answer_line_noul: "Answer yes or no."
    answer_line_choice: "lettered option list, then 'Answer with one letter.'"
  training_loop: {noul: BCE, choice: CE, score: "CE + 0.5*RPS", consistency_lambda: 0.5, consistency_warmup_epochs: 1,
                  gliclass_augmentation: false}

# ------------------------------------------------------------------------------------------------------------------
# Deterministic label rules (4.1) and their parameters
# ------------------------------------------------------------------------------------------------------------------
label_rules:
  ids: [R0_BASE_SRC, R1_NOUL_OF_LABEL, R2_NEG, R3_EQUIV, R4_CHOICE2, R5_CHOICE3, R6_HIER, R7_SCORE_REV, R8_THRESH,
        R9_REBIN, R10_CONJ, R10_DISJ, R11_SLOT, R12_SOFT, R13_ATTACK_INVARIANT, R14_FRESH_SPEC, R15_HUMAN_PAIR,
        R16_GOLD_REMOVED, R17_TRAP]
  hard_ok_soft_band: [0.2, 0.8]            # soft q strictly inside => hard_ok = false
  choice3_map: {entailment: "true", supports: "true", "YES": "true", contradiction: "false", refutes: "false", "NO": "false",
                neutral: cannot tell, not_enough_info: cannot tell, "DON'T KNOW": cannot tell}
  choice3_keys: ["true", "false", cannot tell]
  none_option: none of these
  thresholds:
    clothing: {t: 4, adjacent_ratings: [3, 4]}
    drug: {t_eval: 7, t_train: [5, 7, 9], adjacent_ratings_eval: [6, 7]}
    sst5: {positive_levels: [3, 4], negative_levels: [0, 1], positive_edge: 0.6, negative_edge: 0.4,
           adjacent_band: 0.05, bin_edge_drop_band: 0.02}
    supertweeteval: {positive_levels: [3, 4]}
    civil: {toxic_q: 0.5, score4_bins: [0.0, 0.2, 0.5, 0.8, 1.0], score4_levels: [almost none, some, most, nearly all],
            complement_if_q_le: 0.2, complement_if_q_ge: 0.8, toxic_levels: [2, 3]}
    mhs: {insult_yes_median_ge: 3, insult_no_median_le: 1, soft_only_median: 2, min_annotators: 3}
    goemotions: {gold_yes_q_min: 0.8, gold_no_q: 0.0, min_raters: 3, choice_min_votes: 2}
  rebin:
    drug_10_to_5: "floor((r - 1) / 2)"
    drug_10_to_3: {0: [1, 2, 3], 1: [4, 5, 6, 7], 2: [8, 9, 10]}
    drug_10_to_2: "1[r >= 6]"
    clothing_5_to_3: {0: [1, 2], 1: [3], 2: [4, 5]}   # satisfaction-3 (label-key author decision)
  slot:
    date_anchor: "2022-03-15T09:00"
    threshold_side_split: 0.5
    headline: false
  score_kernel:                           # 4.3 ordinal soft targets
    default: {gold: 0.70, pm1: 0.15}
    drug_k10: {gold: 0.60, pm1: 0.15, pm2: 0.05}

# ------------------------------------------------------------------------------------------------------------------
# TRAIN (3.1, 4.3, 4.4). Totals: L0 13,000 + L2 4,600 + L3 4,140 = 21,740.
# ------------------------------------------------------------------------------------------------------------------
train:
  rows_total: 21740
  base_states_approx: 7200
  layers: {L0_base: 13000, L2_consistency: 4600, L3_robustness: 4140}
  question_type_mix: {noul: 0.57, choice: 0.30, score: 0.13, tolerance: 0.02}
  score_k_train: [2, 3, 5, 10]
  score_k_eval_only: [4, 7]
  base_noul_yes_rate: 0.50
  noul_yes_rate_tolerance: 0.02
  commercial_only: true
  sources:                                # L0 base: states, rows, questions, sampling
    banking77: {split: "train minus dev hold-out", states: 900, rows: 1800, questions: [choice, noul],
                choice_k: [4, 16], choice_has_none: true, per_label_approx: 12, screen_drop_top_frac: 0.05,
                confusables_as_choice_options: true, confusables_as_noul_gold_no: false}
    clinc150: {split: train, states: 800, states_in_scope: 650, states_oos: 150, rows: 1600, questions: [choice, noul],
               domain_noul_share: 0.30, balanced_domains: 10, oos_choice_gold: none of these, oos_noul_gold: 0}
    massive: {split: train, states: 500, rows: 1000, questions: [choice, noul], scenario_noul_share: 0.30,
              per_intent_max: 10, rare_intents_all_rows: true}
    dbpedia14: {split: train, states: 450, rows: 900, questions: [choice, noul], choice_k_max: 14,
                noul_targets: [class, super_class], oversample_2x: [Village, NaturalPlace, Building, Album, Film, WrittenWork],
                state_max_words: 120}
    goemotions: {split: simplified_train_ids, states: 600, rows: 1200, questions: [noul, choice_ekman7_or_score3],
                 min_raters: 3, choice_requires_one_group_ge_votes: 2}
    clothing: {split: train, states: 450, rows: 1200, questions: [score5, noul_recommend, noul_rating_ge_4],
               score5_rebin_to_3_share: 0.30, rating_ge4_noul_state_share: 0.3333, per_star_level: 90}
    drug: {split: regrouped_train, states: 400, rows: 900, score_k_mix: {10: 0.40, 5: 0.30, 3: 0.15, 2: 0.15},
           noul_thresholds: [5, 7, 9], per_rating: 40, top_conditions: 30, html_unescape: true,
           regroup: {pool: [train, test], group_by: normalised_review_text, fractions: {train: 0.8, dev: 0.1, eval: 0.1}}}
    mnli: {split: train, states: 500, state_unit: promptID_group, rows: 1500, noul_label_mix: {entailment: 0.50, neutral: 0.25, contradiction: 0.25},
           extra_choice3_or_score3_group_share: 0.20, neutral_decidable: false}
    wanli: {split: train, states: 700, rows: 700, noul_label_mix: {entailment: 0.50, neutral: 0.25, contradiction: 0.25}}
    boolq: {split: "train minus every passage used by any eval state, BECEL file or BoolQ-NP dev cluster", states: 1000,
            rows: 1000, true_downsample_to: 0.50}
    condaqa: {split: train, states: 600, state_unit: PassageID_group, rows: 600, dont_know_as: choice3, drop_free_span: true}
    vitaminc: {split: train, states: 300, case_quadruples: 150, rows: 600, score3_share: 0.30, revision_types: [real, synthetic]}
  soft_targets:                           # 4.3 label smoothing epsilon per source (Noul/Choice)
    goemotions_noul: "(votes + 0.5) / (raters + 1)"
    goemotions_score3_strength: {0_votes: 0, 1_vote: 1, ge2_votes: 2}
    epsilon: {banking77: 0.06, banking77_confusable_target: 0.12, clinc150: 0.03, massive: 0.05, dbpedia14: 0.02,
              mnli: 0.08, wanli: 0.10, boolq: 0.08, condaqa: 0.06, vitaminc: 0.05, clothing_recommend: 0.03,
              rating_threshold_adjacent: 0.20}
    temperature_fit: dev_base_rows_per_question_type
  L2_consistency:                         # 4.4
    negation_template: {rows: 1700, rule: R2_NEG, classes: [C1, C2, C4, QA, QJ], negated_yes_rate: [0.45, 0.55]}
    trap_undecidable: {rows: 300, rule: R17_TRAP, sources: [mnli_neutral, wanli_neutral, condaqa_dont_know, vitaminc_nei]}
    trap_contrary: {rows: 250, rule: R17_TRAP, kinds: [clothing_rating3_positive_negative, vitaminc_more_less, mnli_true_vs_contradicting_paraphrase]}
    paraphrase: {rows: 900, rule: R3_EQUIV}
    double_negation: {rows: 350, rule: R3_EQUIV, classes: [C2, C4], field: negP_tr}
    choice2_twin: {rows: 450, rule: R4_CHOICE2, key_sets: [["yes", "no"], ["true", "false"]]}
    score_transforms: {rows: 400, polarity_reversal: 250, rebin: 75, threshold: 75, rules: [R7_SCORE_REV, R9_REBIN, R8_THRESH],
                       order_reversal: 0}
    hierarchy: {rows: 250, rule: R6_HIER, parents: [clinc150_domain, massive_scenario, dbpedia14_super_class]}
  L3_robustness:
    injection_targeted: {rows: 800, states: 700, family_rows: {A: 250, B: 220, E: 150, G: 180}, primary_plus_related_states: 100,
                         inline_share: 0.5, container_share: 0.5}
    echo_controls: {rows: 800, states: 800}
    neutral_twins: {rows: 350, states: 350, length_tolerance: 0.10}
    offtarget_bipia_train: {rows: 200, states: 200}
    hard_negatives: {rows: 240, states: 120, rule: R0_BASE_SRC, verticals: [HR helpdesk, IT helpdesk, e-commerce returns]}
    distractor: {rows: 1600, states: 800, corpus_mix: {wikitext103: 0.70, boilerplate_A: 0.30}, dose_multipliers: [0.5, 1, 2, 4],
                 min_chars: 80, positions: [prefix, suffix, interleave], max_tokens: 700}
    hard_reference: {rows: 150, states: 150, corpus: reference_A}
    targeted_echo_ratio: 1.0
    targeted_echo_tolerance: 0.02
  hygiene:
    gliclass_builtin_augmentation: false
    max_template_share_of_noul_rows: 0.08
    max_rows_per_label_frame_pair: 2
    description_use_share_per_label: [0.25, 0.40]
    key_only_choice_share: 0.15
    gold_removed_intent_choice_share: 0.10
    choice_options_repermuted_each_epoch: true
  ablations:                              # 4.5 (all step-matched; 3 seeds for A0-A3)
    seeds_per_recipe: 3
    recipes:
      A0: {rows: 13000, layers: [L0], targets: hard, extra_loss: null}
      A1: {rows: 13000, layers: [L0], targets: soft, extra_loss: null}
      A2a: {rows: 17600, layers: [L0, L2], targets: soft, extra_loss: null}
      A2b: {rows: 17600, layers: [L0, L2], targets: soft, extra_loss: consistency}
      A3: {rows: 21740, layers: [L0, L2, L3], targets: soft, extra_loss: [consistency, invariance]}
      A3-LOFO: {families: [A, B, E, G], base: A3}
      X-wording1: {file: train_wording1.jsonl, frames_per_label: 1, descriptions_per_label: 1, base: A3}

# ------------------------------------------------------------------------------------------------------------------
# DEV and DEV_ZS (3.2)
# ------------------------------------------------------------------------------------------------------------------
dev:
  rows_total: 2000
  layers: {base: 1200, consistency: 420, injection: 220, distractor: 160}
  partitions:
    banking77: train remainder
    clinc150: validation
    massive: validation
    dbpedia14: train remainder
    goemotions: simplified validation ids
    clothing: val
    drug: regrouped dev groups
    mnli: validation_mismatched
    wanli: "test minus its 41 MNLI-premise rows"
    boolq: passage-disjoint remainder
    condaqa: validation
    vitaminc: validation
  pools: {aff_style: F9, neg_class: C7, qn_class: QD, injection_family: J, filler: [gutenberg_english, boilerplate_C]}
  filler: {gutenberg_passages: 500, boilerplate_C: 15, exclude: pg19_test_titles}
  uses: [early_stopping, temperature_per_question_type, dev_threshold_coverage, deberta_none_variant_choice]
dev_zs:
  rows_total: 600
  sources:
    minds14: {rows: 200, configs: [en-US, en-GB, en-AU], drop_columns: [audio], banking77_duplicates_expected: 38}
    snips: {rows: 200}
    hans: {rows: 200, split: validation, flag: template_labels}
  pools: dev
  dedup_against: [train, eval]

# ------------------------------------------------------------------------------------------------------------------
# EVAL core (3.3, 10.1). Per-dataset numbers mirror design/design_plan.py.
# ------------------------------------------------------------------------------------------------------------------

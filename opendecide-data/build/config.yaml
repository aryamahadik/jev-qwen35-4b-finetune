# OpenDecide dataset v1.0-rc: build configuration.
# Every quota, seed, cap, pool map and source pin that a build step needs lives here (DESIGN.md 3-7, 10, 11, 13),
# so no step hard-codes a number. Where this file and DESIGN.md disagree, DESIGN.md wins (and its
# "Build deviations (v1.0-rc)" section wins over the rest of DESIGN.md); fix this file, then rebuild.
# authored_by: llm:claude:foundation-engineer-1 (2026-09-25). Numbers were cross-checked against design/design_plan.py;
# s00_env re-checks every declared total below and fails the build on a mismatch.

schema_version: od-1.0
build_version: 1.0.0-rc
release_label: v1.0-rc-llmverified
authored_by_prefix: "llm:claude:"          # D1: provenance of everything agents author

# ------------------------------------------------------------------------------------------------------------------
# Seeds and ids (DESIGN 1.1, 13 step 0)
# ------------------------------------------------------------------------------------------------------------------
master_seed: 20260925
seeds:
  sub_seed_rule: 'int(sha256(f"{master_seed}:{step}:{source}:{group}").hexdigest()[:16], 16) -> numpy.random.Generator(PCG64)'
  row_id_rule: '"r_" + sha1(f"{master_seed}|{key}").hexdigest()[:12]'
  call_id_rule: '"c_" + sha1(f"{master_seed}|{split}|{state}").hexdigest()[:12]   # object states: canonical JSON'
  group_id_rule: "g:{source}:{source_split}:{source_id} | g:fresh:{family}:{nnn}"
  key_rule: "{split_code}:{source}:{source_split}:{source_id}#{state_variant}/{slot}"
  split_codes: {train: T, dev: D, dev_zs: Z, eval: E}
  option_order_seed_rule: "stable_hash(group_id)"
  criteria_mode_rule: "stable_hash(group_id) parity: even -> null, odd -> restating (fresh: authored)"
  btzsc_sampler:                         # AbdelStark protocol (3.4): random.Random(20260917 + offset).shuffle per class
    base_seed: 20260917
    offsets: {agnews: 0, emotiondair: 1, banking77: 2}
    expected_first_ids: {agnews: [9, 267, 292, 427, 437], emotiondair: [23, 25, 50, 56, 63]}
    expected_counts: {agnews_per_class: 25, emotiondair: [17, 17, 17, 17, 16, 16], banking77_valid: 2880, banking77_total: 3080}
  outputs_sorted_by: id

# ------------------------------------------------------------------------------------------------------------------
# Environment (13 step 0) — asserted by s00_env
# ------------------------------------------------------------------------------------------------------------------
env:
  python: "3.12"
  venv: .venv
  packages_exact: {datasets: 4.8.5, transformers: 4.57.6, gliclass: 0.1.17, typesafe-sdk: 0.7.1}
  packages_required: [sentence-transformers, datasketch, spacy, en-core-web-sm, pyyaml, jsonschema, numpy, pandas,
                      scikit-learn, scipy, requests, huggingface-hub, torch]
  requirements_lock: build/requirements.lock.txt
  typesafe_request_schema: typesafe_sdk._schemas.models.SystemOneRequest   # D6 fallback: local schema from docs
  spacy_model: en_core_web_sm
  max_process_ram_gb: 2

# ------------------------------------------------------------------------------------------------------------------
# Build steps (13). The driver runs build/steps/sNN_<name>.py in this order and warns about missing ones.
# ------------------------------------------------------------------------------------------------------------------
build:
  steps: [s00_env, s01_lock, s02_normalise, s03_index, s04_sample_eval, s05_verification, s06_sample_train_dev,
          s07_render, s08_variants, s09_robustness, s10_fresh_cmp, s11_assemble, s12_validate, s13_stats_power,
          s14_package]
  two_pass: true                         # D9: demand-driven assets are authored after pass 1 writes field_demand.csv
  freeze: {manifest: data/manifest.json, frozen_txt: FROZEN.txt, git_tag: null}   # D5: no git commit or tag
  lofo_families: [A, B, E, G]

# ------------------------------------------------------------------------------------------------------------------
# Budgets and caps (0, 3.5, 9.2 V7/V8/V16, 10.3)
# ------------------------------------------------------------------------------------------------------------------
caps:
  jev_calls: 1500
  eval_plus_diag_rows: 5000
  train_dev_devzs_rows: 25000
  jev_budget_usd: 0.15
  per_dataset_state_floor: 24
  per_dataset_track_share_max: 0.25
  choice_k_max: 20
  choice_k_max_cmp: 72
  score_levels_min: 2
  score_levels_max: 10
  min_text_tokens: 3
  tokens:                                # Ettin tokens unless the key names another tokenizer
    clean_eval_state: 350
    clean_eval_state_deberta: 400
    inj_base_state: 300
    inj_attacked_state_deberta: 450
    dist_base_state: 150
    dist_short_dose_state: 300
    dist_long_dose_state: 650            # DeBERTa not scored on long-dose rows (fits.deberta_512 = false)
    gliclass_full_input: 1000            # labels + prompt + state
    gliclass_max_length: 1024
    deberta_max_length: 512
    train_state: 700
    payload_min: 12
    payload_max: 90
    boolq_passage_max: 250
    civil_comment_max: 200
  dbpedia_state_max_words: 120
  tokenizers: {ettin: jhu-clsp/ettin-encoder-32m, modernbert: answerdotai/ModernBERT-base, deberta_v3: MoritzLaurer/deberta-v3-large-zeroshot-v2.0-c}

# ------------------------------------------------------------------------------------------------------------------
# Jev protocol (4.6, 10.3)
# ------------------------------------------------------------------------------------------------------------------
jev:
  model: jev-1.13.0
  sdk: typesafe-sdk==0.7.1
  endpoint: https://api.typesafe.ai/v1/systemone
  price_per_input_token_usd: 4.2e-08
  fixed_tokens_per_call: 280
  concurrency: 8
  run_window_hours: 24
  run_order: [CMP+ANC, REL, core, INJ, DIST]
  harness_gate:
    banking77_replay_accuracy: [0.80, 0.93]
    doc_refund_noul: [0.17, 0.27]
    doc_yes_no_choice_p_yes_max: 0.06
    doc_refund_plus_other_than_sum: [1.09, 1.29]
  never_use_confidence: true
  never_train_on_outputs: true

# ------------------------------------------------------------------------------------------------------------------
# State wrappers (3.5). Fixed per source, identical in train and eval; applied at render, never in loaders.
# {text} is the normalised record's text; other slots come from record.meta.
# ------------------------------------------------------------------------------------------------------------------
wrappers:
  banking77: "Customer message:\n{text}"
  clinc150: "Customer message:\n{text}"
  massive: "Customer message:\n{text}"
  minds14: "Customer message:\n{text}"
  hint3_sofmattress: "User message to the {bot_domain} chatbot:\n{text}"
  hint3_curekart: "User message to the {bot_domain} chatbot:\n{text}"
  nlupp_banking: "{date_line}\nCustomer message:\n{text}"
  nlupp_hotels: "{date_line}\nGuest message:\n{text}"
  boolq: "Passage ({title}):\n{text}"
  mnli: "Passage:\n{text}"
  wanli: "Passage:\n{text}"
  nan_nli: "Passage:\n{text}"
  becel_snli: "Passage:\n{text}"
  hans: "Passage:\n{text}"
  condaqa: "Passage:\n{text}"             # not listed in 3.5; NLI passage wrapper (build_decisions.md)
  vitaminc: "Evidence:\n{text}"
  clothing: "Product review:\n{text}"
  drug: "Medication review (condition: {condition}):\n{text}"
  sst5: "Movie review sentence:\n{text}"
  tfns: "Tweet:\n{text}"
  supertweeteval: "Tweet:\n{text}"       # target is named in the question, not the state
  sms_spam: "SMS message:\n{text}"
  civil: "Online comment:\n{text}"
  mhs: "Online comment:\n{text}"
  goemotions: "Reddit comment:\n{text}"
  dbpedia14: "Encyclopedia entry:\n{title}. {text}"
  snips: "User message:\n{text}"          # not listed in 3.5 (dev_zs only; build_decisions.md)
  fresh: null                             # authored formats (tickets, emails, policy + case sheets)
wrapper_slots:
  hint3_bot_domain: {sofmattress: mattress store, curekart: health supplement store}
  nlupp_date_line: "Today is Tuesday, 15 March 2022, 09:00."


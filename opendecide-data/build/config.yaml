# ------------------------------------------------------------------------------------------------------------------
verification:
  statuses: [llm_2of2, llm_2of3, llm_fresh_2of2, rule, llm_1v, train_1v, unverified]
  label_basis: "source annotation + 2 blind LLM verifiers"
  screen: {p_gold_max: 0.05, p_other_min: 0.7, auto_drop: false, expected_flag_rates: {banking77: 0.010, clinc150: 0.009, massive: 0.022}}
  pii: {mask_email: "<EMAIL>", mask_phone: "<PHONE>", hint3_digit_run_min: 7, general_digit_run_min: 10}
  soft_hard_gold_band: [0.2, 0.8]
  label_checks: {five_plus_five: [D_ev, P_ev1], option_only: three_plus_three, equivalence_fields: [P_ev2, negP_ev, np_ev],
                 p_ev_jaccard_max: 0.6, p_ev_vs_p_tr_jaccard_max: 0.5, banned_hypothesis_minhash: 0.6}
  template_audit: {items_per_task_family: 2, annotators: 2}
  perturbed: {targeted_annotators: 2, controls_annotators: 1}
  descoping_order: [sealed_reserve_22_per_family, frame_only_paraphrases, template_audit_1_item_seen_class, dist_checks_long_dose_only]
  human_packs_priority: [fresh, eval_negation_paraphrase_scope_fields_and_template_audit, targeted_attacked_states,
                         flagged_or_disagreed_base_items]   # D4

# ------------------------------------------------------------------------------------------------------------------
# Leakage and dedup (9.1)
# ------------------------------------------------------------------------------------------------------------------
dedup:
  normalise: "NFKC, lower-case, non-alphanumeric runs -> one space"
  prefix_chars: 60
  minhash: {shingle: char5, num_perm: 128, threshold: 0.8, review_band: [0.6, 0.8], min_tokens: 4}
  minilm: {threshold: 0.95, review_band: [0.90, 0.95]}
  payload_vs_train_minhash_max: 0.5
  filler_vs_eval_base_minhash_max: 0.5
  group_keys: {boolq: passage, condaqa: PassageID, vitaminc: case_id, mnli: promptID, drug: normalised_text, goemotions: id}
  expected_hits: {banking77_test_train: [25, 43], clinc150_test_train: [19, 24], nlupp_vs_banking77: 13, nlupp_vs_clinc150: 28,
                  minds14_vs_banking77: 38, boolq_validation_passages_shared: 721, tweeteval_vs_supertweeteval_test_share: 0.35}
  contamination_drop_tracks: [ZS, FR]

# ------------------------------------------------------------------------------------------------------------------
# Metrics, power and analysis (5, 10.2) — planning assumptions; s13 recomputes from realised counts
# ------------------------------------------------------------------------------------------------------------------
analysis:
  holm_endpoints: [E1, E3, E4, E5]
  alpha: 0.05
  alpha_holm_first: 0.0125
  estimate_only: [E2]
  bootstrap_resamples: 10000
  bh_q_secondary: 0.05
  nll_clip: 1.0e-12
  nll_floor_sensitivity: 0.005
  ece_bins: 10
  ece_noise_floor_draws: 2000
  coverage: {eps_primary: 0.01, eps_comparability: 0.05, folds: 2, fold_seeds: 5}
  guards: {accuracy_noninferiority_pp: -2, trap_pass_noninferiority_pp: -5, echo_dp_gold_lower_bound: -0.03, neutral_flip_upper_pp: 2}
  training_seeds: 3
  power_assumptions: {e1_design_effect: 1.15, e3_design_effect: 1.5, e5_attacks_per_item: 3.5, e5_icc: 0.3,
                      ret_human_neg: 0.85, ret_c6_single: 0.85, two_of_two_share: 0.90}
  cpu_budget_minutes: {gliclass_edge_full_eval: 30}
  degenerate_battery:
    constant_half: {auc_max: 0.51, both_correct_max: 0.02}
    always_no: {raw_noul_accuracy: [0.45, 0.55]}
    negation_word_flipper: {balanced_accuracy_max: 0.55, abs_corr_max: 0.05, probe_auc_max: 0.60}
    regex_complementer: {match_share_max: 0.05}
    negation_cue_complementer: {trap_pass_max: 0.05, trap_accuracy_max: 0.55}
    question_only_tfidf: {balanced_accuracy_max: 0.55}
    avoid_named_label: {echo_gap_min_pp: 20}
    ignore_instruction_sentences: {fr_hneg_accuracy_max: 0.6}
    first_64_tokens: {prefix_arm_loss_min_pp: 20}
    centre_level_score: {exact_accuracy_max: 0.25}
    first_option_choice: {gold_position_chi2_p_min: 0.05}
    always_none: {accuracy_max: 0.3, oos_choice_share_max: 0.30}

# ------------------------------------------------------------------------------------------------------------------
# Release (11)
# ------------------------------------------------------------------------------------------------------------------
release:
  tiers: {open_by: CC-BY-4.0, open_sa: CC-BY-SA-4.0, idonly: "ids + build/rehydrate.py", sealed: "hash only"}
  team_assets_license: CC-BY-4.0
  canary: "OPENDECIDE-CANARY-<uuid4 fixed at freeze>"
  idonly_null_question_sources: [becel, boolq_np]
  profile_permissive_drops: [dbpedia14, mnli, boolq, vitaminc]
  excluded_for_licence: [ANLI, FPB, gandalf-rct, Tensor Trust, Bitext, xTRam1, jayavibhav, geekyrakshit, Yelp, IMDB, AG News, DAIR]

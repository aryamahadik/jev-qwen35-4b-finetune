    max_base_tokens: 150
    per_dataset: {banking77: 8, clinc150: 8, hint3: 8, nlupp: 8, sms_spam: 8, sst5: 8, boolq_bundle: 8, goemotions: 8}
  arms:                                   # states, rows per state
    short_dose: [64, 2]
    long_dose: [64, 2]
    hard_reference: [24, 2]
    placebo: [20, 2]
